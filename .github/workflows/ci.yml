name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked pytest -q -m "not needs_docker"

  containment:
    # AIC-009: build the CPU worker image and run the hostile containment probes in real containers.
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked python scripts/build_worker_image.py --variant cpu
      - run: uv run --locked pytest -q -m needs_docker --require-docker
