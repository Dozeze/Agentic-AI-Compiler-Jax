[project]
name = "dd2430"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic[vertex]>=1.3.0",
    "claude-agent-sdk>=0.2.151",
    "google-genai>=1.0",
    "jax==0.4.38",
    "matplotlib>=3.10",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
# JAX 0.4.38 supports CUDA 12 wheels on Linux. Keep the CPU setup as default.
cuda12 = ["jax[cuda12]==0.4.38; sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]          # only tests/ is collected; root scripts are never collected
addopts = "-ra -p no:anyio"    # the anyio plugin emits PytestRemovedIn10Warning on pytest 9.2; it is unused
markers = [
  "slow: takes longer than 10 seconds",
  "needs_gpu: needs CUDA; skipped without it, an error with --require-gpu",
  "needs_docker: needs Docker and the worker image; skipped without them, an error with --require-docker",
]
